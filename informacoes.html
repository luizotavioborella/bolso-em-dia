<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Informações</title>
    <link rel="icon" href="assets/img/logo-escuro.png" type="image/png">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main>
        <div class="passos">
            <img src="assets/img/passo2.png" alt="Etapas do cadastro">
            <div class="textos-passos">
                <p class="texto1">Criar conta</p>
                <p class="texto2">Adicionar informações</p>
                <p class="texto3">Cadastro concluído</p>
            </div>
        </div>

        <div class="container container-informacoes">
            <img class="logo" src="assets/img/logo-horizontal.png" alt="Bolso em Dia">
            <h1>Cadastrar Informações</h1>
            <p class="subtitulo">Cadastre algumas informações secundárias</p>

            <form action="concluido.html" method="get">
                <div class="campo-info">
                    <div class="icone-info texto-icone">R$</div>
                    <input type="number" id="valor-diaria" name="valor-diaria" step="0.01" placeholder="Valor da diária. Ex: 40,00" required>
                </div>

                <div class="campo-info">
                    <div class="icone-info">
                        <img src="assets/img/caixa.png" alt="">
                    </div>
                    <input type="number" id="minimo-pacotes" name="minimo-pacotes" placeholder="Mínimo de pacotes para adicional. Ex: 1000" required>
                </div>

                <div class="campo-info">
                    <div class="icone-info texto-icone">R$</div>
                    <input type="number" id="valor-adicional" name="valor-adicional" step="0.01" placeholder="Valor adicional. Ex: 0,03" required>
                </div>

                <div class="botoes botoes-info">
                    <a class="voltar" href="dashboard.html">Voltar</a>
                    <button type="submit" class="cadastrar">Cadastrar</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
