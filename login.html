<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/login.css">
    <title>Bolso em dia</title>
</head>

<body>

    <main class="login">

        <img class="logo" src="assets/img/logo.png" alt="Logo Bolso em Dia">

        <h1>Fazer Login</h1>
        <p class="descricao">Acesse sua conta para continuar cuidando<br> das suas finanças</p>

        <form>
            <div class="campo">
                <img src="assets/img/usuario.png" alt="Ícone de usuário">
                <input id="email" type="text" placeholder="E-mail, telefone ou CPF" required>
            </div>

            <div class="campo">
                <img src="assets/img/cadeado.png" alt="Ícone de cadeado">
                <input id="senha" type="password" placeholder="Senha" required>
            </div>

            <button class="entrar" type="submit">
                <span>Entrar</span>
                <img src="assets/img/seta-direita.png" alt="Ícone de seta">
            </button>
        </form>

        <div class="cadastrar">
            <strong>Não tem cadastro?</strong>
            <a href="dashboard.html">Cadastre-se</a>
        </div>

    </main>

</body>
</html>

</body>
</html>
