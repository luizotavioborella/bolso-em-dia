<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bolso em Dia</title>
    <link rel="icon" href="assets/img/logo-escuro.png" type="image/png">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="pagina-login">
        <div class="container container-login">
            <img class="logo logo-login" src="assets/img/logo-horizontal.png" alt="Bolso em Dia">
            <h1>Fazer Login</h1>
            <p class="subtitulo">Acesse sua conta para continuar cuidando das suas finanças</p>

            <form action="#" method="get">
                <div class="campo">
                    <img src="assets/img/user.png" alt="">
                    <input type="text" id="usuario" name="usuario" placeholder="E-mail, telefone ou CPF" required>
                </div>

                <div class="campo">
                    <img src="assets/img/cadeado.png" alt="">
                    <input type="password" id="senha-login" name="senha" placeholder="Senha" required>
                </div>

                <button class="entrar" type="submit">
                    <span>Entrar</span>
                    <img src="assets/img/seta-direita.png" alt="">
                </button>
            </form>

            <div class="link-cadastro">
                <span>Não tem cadastro?</span>
                <a href="dashboard.html">Cadastre-se</a>
            </div>
        </div>
    </main>
</body>
</html>
