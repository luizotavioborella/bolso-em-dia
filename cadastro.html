<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="icon" href="assets/img/logo-escuro.png" type="image/png">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main>
        <div class="passos">
            <img src="assets/img/passo1.png" alt="Etapas do cadastro">

            <div class="textos-passos">
                <p class="texto1">Criar conta</p>
                <p class="texto2">Adicionar informações</p>
                <p class="texto3">Cadastro concluído</p>
            </div>
        </div>

        <div class="container">
            <img class="logo" src="assets/img/logo-horizontal.png" alt="Bolso em Dia">
            <h1>Cadastre-se</h1>
            <p class="subtitulo">Crie sua conta e comece a organizar suas finanças</p>

            <form action="informacoes.html" method="get">
                <div class="campo">
                    <img src="assets/img/user.png" alt="">
                    <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
                </div>

                <div class="campo">
                    <img src="assets/img/mail.png" alt="">
                    <input type="email" id="email" name="email" placeholder="E-mail" required>
                </div>

                <div class="campo">
                    <img src="assets/img/calendario.png" alt="">
                    <input type="date" id="data-nascimento" name="data-nascimento" placeholder="Data de nascimento" required>
                </div>

                <div class="campo">
                    <img src="assets/img/telefone.png" alt="">
                    <input type="text" id="telefone" name="telefone" placeholder="Telefone" required>
                </div>

                <div class="campo">
                    <img src="assets/img/cpf.png" alt="">
                    <input type="text" id="cpf" name="cpf" placeholder="CPF" required>
                </div>

                <div class="campo">
                    <img src="assets/img/cadeado.png" alt="">
                    <input type="password" id="senha" name="senha" placeholder="Senha" required>
                </div>

                <div class="campo">
                    <img src="assets/img/cadeado.png" alt="">
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirmar senha" required>
                </div>

                <div class="botoes">
                    <button type="button" class="cancelar">Cancelar</button>
                    <button type="submit" class="continuar">Continuar</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
